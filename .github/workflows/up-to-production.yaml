name: Up to Production

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Install Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '22.11.0'

    - name: Install dependencies
      run: npm install

    - name: Build the app
      run: npm run build

    - name: Ensure deployment directory exists on VPS
      uses: appleboy/ssh-action@v0.1.7
      with:
        host: ${{ secrets.VPS_IP }}
        username: ${{ secrets.VPS_USER }}
        key: ${{ secrets.VPS_SSH_KEY }}
        port: ${{ secrets.VPS_PORT }}
        script: |
          set -e
          echo "Ensuring directory /var/www/imphnen-website/ exists"
          sudo mkdir -p /var/www/imphnen-website/
          sudo chown ${{ secrets.VPS_USER }} /var/www/imphnen-website/

    - name: Upload built app to VPS
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.VPS_IP }}
        username: ${{ secrets.VPS_USER }}
        key: ${{ secrets.VPS_SSH_KEY }}
        port: ${{ secrets.VPS_PORT }}
        source: ./dist/*
        target: /var/www/imphnen-website/
        rm: true
        overwrite: true
